spring.application.name=SRM Event Management System

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:srm_event_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep application startup independent from MySQL availability. Connections are
# opened only by JDBC operations such as the dedicated database health check.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=${JWT_ISSUER:srm-event-management}

# Account-security controls. Login throttling is bounded and in-memory for the
# single-node project deployment; use a shared limiter before horizontal scale.
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-seconds=${LOGIN_WINDOW_SECONDS:900}
app.security.login.lock-seconds=${LOGIN_LOCK_SECONDS:900}
app.security.password-reset.lifetime-seconds=${PASSWORD_RESET_LIFETIME_SECONDS:1800}

# Browser origins permitted to call the shared API. Override with a
# comma-separated CORS_ALLOWED_ORIGINS value in deployed environments.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Authenticated document storage. The local implementation stores opaque keys
# under the ignored storage directory; production can replace DocumentStorage.
app.storage.root=${DOCUMENT_STORAGE_ROOT:../storage/documents}
app.storage.max-file-size-bytes=${DOCUMENT_MAX_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Never include stack traces, exception classes, or binding internals in API errors.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Block 14 notification generation is deliberately disabled by default.
notifications.weekly-followup.enabled=${NOTIFICATIONS_WEEKLY_FOLLOWUP_ENABLED:false}
notifications.weekly-followup.cron=${NOTIFICATIONS_WEEKLY_FOLLOWUP_CRON:0 0 9 ? * MON}
notifications.post-event.cron=${NOTIFICATIONS_POST_EVENT_CRON:0 15 * * * *}
notifications.weekly-followup.timezone=${NOTIFICATIONS_WEEKLY_FOLLOWUP_TIMEZONE:Asia/Kolkata}

